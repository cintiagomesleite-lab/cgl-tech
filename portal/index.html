<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --navy-900:#071a3a; --navy-800:#13284f; --navy-300:#94a3b8;
  --bg:#f4f6fa; --card:#ffffff; --ink:#0f172a; --ink-soft:#64748b; --line:#e2e8f0;
  --gold:#c5a35e; --gold-soft:#f5eedf; --gold-deep:#8a6d2f;
  --ok:#059669; --ok-soft:#d1fae5; --warn:#b45309; --warn-soft:#fef3c7; --danger:#dc2626; --danger-soft:#fee2e2;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
body{min-height:100vh;}
button{font:inherit;cursor:pointer;}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px;}
/* topo */
.topo{background:linear-gradient(160deg,var(--navy-900),var(--navy-800));color:#fff;padding:18px 0 54px;}
.topo .wrap{padding-bottom:0;display:flex;align-items:center;gap:12px;}
.topo img{width:44px;height:auto;}
.topo .marca{font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;letter-spacing:.01em;}
.topo .sub{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:2px;}
.topo .sair{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:7px 12px;font-size:.8rem;}
.ola{margin:-40px auto 0;}
.ola .card{padding:18px;}
.ola h1{font-size:1.25rem;margin:0 0 4px;}
.ola .emp{font-size:.86rem;color:var(--ink-soft);}
select.emp-sel{margin-top:10px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:.92rem;}
/* cartões */
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 16px rgba(15,23,42,.04);padding:16px;margin-top:14px;}
.card h2{font-size:1rem;margin:0 0 2px;display:flex;align-items:center;gap:8px;}
.card .sub{font-size:.78rem;color:var(--ink-soft);margin-bottom:10px;}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);}
.item:first-of-type{border-top:0;}
.item .main{flex:1;min-width:0;}
.item .t{font-weight:600;font-size:.92rem;}
.item .d{font-size:.78rem;color:var(--ink-soft);margin-top:2px;}
.item .v{font-weight:700;font-size:.95rem;white-space:nowrap;}
.data-box{width:46px;text-align:center;border-radius:10px;background:var(--gold-soft);color:var(--gold-deep);padding:5px 0;flex-shrink:0;}
.data-box .dd{font-size:1.05rem;font-weight:700;line-height:1.1;}
.data-box .mm{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;}
.data-box.atras{background:var(--danger-soft);color:var(--danger);}
.data-box.ok{background:var(--ok-soft);color:var(--ok);}
.tag{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:4px;vertical-align:1px;}
.tag.ok{background:var(--ok-soft);color:var(--ok);} .tag.warn{background:var(--warn-soft);color:var(--warn);} .tag.danger{background:var(--danger-soft);color:var(--danger);} .tag.neutral{background:#eef2f7;color:var(--ink-soft);}
.vazio{font-size:.86rem;color:var(--ink-soft);padding:6px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;text-decoration:none;}
.btn.pri{background:var(--navy-900);color:#fff;}
.btn.gold{background:var(--gold);color:var(--navy-900);}
.btn.leve{background:#eef2f7;color:var(--navy-900);}
.btn.wa{background:#25d366;color:#fff;}
.btn.peq{padding:6px 10px;font-size:.78rem;border-radius:8px;}
.btn[disabled]{opacity:.6;cursor:default;}
.pix{display:flex;gap:8px;align-items:center;background:var(--gold-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:.84rem;}
.pix code{flex:1;word-break:break-all;font-family:inherit;font-weight:600;}
/* login */
.login{max-width:400px;margin:-36px auto 0;}
.login .card{padding:22px;}
.login h1{font-size:1.2rem;margin:0 0 4px;}
.login p{font-size:.86rem;color:var(--ink-soft);margin:0 0 14px;}
label{display:block;font-size:.78rem;font-weight:600;color:var(--ink-soft);margin:12px 0 5px;}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:1rem;background:#fff;color:var(--ink);}
input:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold);}
.msg{font-size:.84rem;margin-top:12px;min-height:1em;}
.msg.erro{color:var(--danger);} .msg.ok{color:var(--ok);}
.rodape{font-size:.74rem;color:var(--ink-soft);text-align:center;margin-top:22px;line-height:1.6;}
.rodape strong{color:var(--ink);}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:g 1s linear infinite;margin:40px auto;}
@keyframes g{to{transform:rotate(360deg);}}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:10px 16px;border-radius:10px;font-size:.86rem;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:9;max-width:90vw;}
.resp{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.82rem;}
.resp div span{display:block;color:var(--ink-soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
@media (max-width:520px){ .resp{grid-template-columns:1fr;} }
/* envio de documentos */
.env-drop{position:relative;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:#f8fafc;margin-top:6px;}
.env-drop.on{border-color:var(--gold);background:var(--gold-soft);}
.env-drop strong{display:block;font-size:.92rem;color:var(--navy-900);}
.env-drop span{display:block;font-size:.76rem;color:var(--ink-soft);margin-top:4px;}
.env-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.env-arq{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;padding:6px 0;border-top:1px solid var(--line);}
.env-arq:first-child{border-top:0;}
.env-arq button{background:none;border:0;color:var(--danger);font-size:.9rem;}
select.campo,textarea.campo{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:.95rem;background:#fff;color:var(--ink);font-family:inherit;}
</style>

/* ---------- marca do escritório (cada escritório vê a sua) ---------- */
function iniciaisDe(nome){
  var p = String(nome||"").replace(/\b(ltda|me|epp|eireli|s\/?a|ss|de|da|do|das|dos|e|contabilidade|cont[aá]bil|consultoria|assessoria|escrit[oó]rio)\b/gi," ").trim().split(/\s+/).filter(function(w){ return /^[A-Za-zÀ-ÿ0-9]/.test(w); });
  return (p.length>=2? p[0][0]+p[1][0] : (p[0]||"?").slice(0,2)).toUpperCase();
}
function logoDe(m){
  if(m.logo) return m.logo;
  if(/\bCGL\b/i.test(m.nome||"")) return LOGO_PADRAO;
  var t = iniciaisDe(m.nome).replace(/[<&>]/g,"");
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140"><path d="M60 4 112 22v44c0 34-22 58-52 70C30 124 8 100 8 66V22z" fill="#071a3a" stroke="#c5a35e" stroke-width="5"/><text x="60" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="44" fill="#c5a35e" font-weight="700">'+t+'</text></svg>');
}
function aplicarMarca(m){
  if(!m || !m.nome) return;
  var img = document.getElementById("mLogo"); img.src = logoDe(m); img.style.display = "";
  document.getElementById("mNome").textContent = m.nome; document.getElementById("mSub").textContent = "Portal do Cliente";
  document.title = "Portal do Cliente — "+m.nome;
  var ic = document.querySelector('link[rel="icon"]'); if(ic) ic.href = logoDe(m);
  marcaAtual = m;
  try{ localStorage.setItem("portal_marca", JSON.stringify({id:m.id||"", nome:m.nome, logo:m.logo||""})); }catch(e){}
}
var marcaAtual = null;
async function marcaInicial(){
  try{ var s = JSON.parse(localStorage.getItem("portal_marca")||"null"); if(s) aplicarMarca(s); }catch(e){}
  var id = (new URLSearchParams(location.search)).get("e");
  if(id && /^[0-9a-f-]{36}$/i.test(id)){
    var r = await sb.rpc("portal_marca", {p_escritorio:id});
    if(!r.error && r.data) aplicarMarca(Object.assign({id:id}, r.data));
  }
}
var MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
var MESES_LONGO = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function esc(s){ return String(s===null||s===undefined? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function hoje(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtData(iso){ if(!iso) return ""; var p = String(iso).slice(0,10).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function fmtMoeda(v){ return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function compLabel(iso){ if(!iso) return ""; var p = String(iso).split("-"); return MESES_LONGO[Number(p[1])-1]+"/"+p[0]; }
function fmtCNPJ(c){ var d = String(c||"").replace(/\D/g,""); return d.length===14? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5") : (c||""); }
function dias(a, b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000); }
function primeiroNome(n){ n = String(n||"").trim().split(/\s+/)[0]||""; return n? n.charAt(0).toUpperCase()+n.slice(1).toLowerCase() : ""; }
function toast(t){ var el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 3200); }
function traduz(err){
  var m = String(err && (err.message||err.error_description) || err || "");
  if(/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if(/AAL2|MFA/i.test(m)) return "Este login usa verificação em 2 etapas (é da equipe do escritório). Para o portal, use o login de cliente.";
  if(/Email not confirmed/i.test(m)) return "E-mail ainda não confirmado. Fale com o escritório.";
  if(/same.*password|different from the old/i.test(m)) return "A nova senha precisa ser diferente da provisória.";
  if(/Password should be|weak/i.test(m)) return "Senha fraca: use pelo menos 8 caracteres, misturando letras e números.";
  if(/Failed to fetch|NetworkError|network/i.test(m)) return "Sem conexão com a internet. Tente de novo.";
  if(/rate limit|too many/i.test(m)) return "Muitas tentativas. Espere alguns minutos e tente de novo.";
  return m || "Algo deu errado. Tente de novo.";
}

/* ---------- login ---------- */
function telaLogin(msg){
  topoAcoes.innerHTML = "";
  app.innerHTML = '<div class="login"><div class="card"><h1>Entrar</h1><p>Acompanhe os vencimentos, as guias, os honorários e os documentos da sua empresa.</p>' +
    '<form id="fLogin" autocomplete="on"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="username" required>' +
    '<label for="lSenha">Senha</label><input id="lSenha" type="password" autocomplete="current-password" required>' +
    '<button class="btn pri" style="width:100%;margin-top:16px;" id="lBtn">Entrar</button></form>' +
    '<div class="msg '+(msg? "erro" : "")+'" id="lMsg">'+esc(msg||"")+'</div>' +
    '<p style="margin:14px 0 0;font-size:.8rem;">Esqueceu a senha ou ainda não tem acesso? Fale com o escritório pelo WhatsApp.</p></div>' +
    '<div class="rodape">Acesso exclusivo para clientes'+(marcaAtual? " da "+esc(marcaAtual.nome) : " do escritório")+'.<br>Conexão protegida · CGL Tech</div></div>';
  document.getElementById("fLogin").onsubmit = async function(ev){
    ev.preventDefault();
    var b = document.getElementById("lBtn"), m = document.getElementById("lMsg");
    b.disabled = true; m.className = "msg"; m.textContent = "Entrando…";
    var r = await sb.auth.signInWithPassword({email:document.getElementById("lEmail").value.trim(), password:document.getElementById("lSenha").value});
    b.disabled = false;
    if(r.error){ m.className = "msg erro"; m.textContent = traduz(r.error); return; }
    iniciar();
  };
}

function docOk(d){

}

  var meus = dados.envios.filter(function(x){ return x.empresa_id===e.id; }).slice(0,8);
  return '<div class="card"><h2>📤 Enviar documentos</h2><div class="sub">Mande para o escritório as notas que você emitiu, as notas de compra (XML ou PDF), extratos e outros documentos</div>' +
    '<div class="env-drop" id="envDrop"><strong>Toque aqui para escolher os arquivos</strong><span>ou arraste para cá · PDF, XML, ZIP, foto, Excel — até '+ENV_MAX_MB+' MB cada</span>' +
    '<input type="file" id="envInp" multiple accept="'+Object.keys(ENV_TIPOS).map(function(x){ return "."+x; }).join(",")+'"></div>' +
    '<div id="envForm" style="display:none;margin-top:10px;"><div id="envLista"></div>' +
    '<label for="envCat">O que você está enviando?</label><select class="campo" id="envCat">'+Object.keys(ENV_CAT).map(function(k){ return '<option value="'+k+'"'+(k===envCatSel?" selected":"")+'>'+ENV_CAT[k]+'</option>'; }).join("")+'</select>' +
    '<label for="envMes">Mês de referência</label><input type="month" id="envMes" value="'+mesAnteriorISO()+'">' +
    '<label for="envObs">Recado para o escritório (opcional)</label><textarea class="campo" id="envObs" rows="2" maxlength="500" placeholder="Ex.: notas de outubro, faltou uma que mando amanhã"></textarea>' +
    '<button class="btn pri" style="width:100%;margin-top:12px;" id="envBtn">Enviar</button></div>' +
    (meus.length? '<div class="sub" style="margin:14px 0 0;">Seus envios recentes</div>' + meus.map(function(x){
      var tag = x.status==="PROCESSADO"? '<span class="tag ok">Recebido pelo escritório ✓</span>' : x.status==="VISTO"? '<span class="tag neutral">Visto</span>' : '<span class="tag warn">Enviado</span>';
      return '<div class="item"><div class="main"><div class="t" style="font-weight:500;word-break:break-all;">'+esc(x.nome_arquivo)+tag+'</div><div class="d">'+esc(ENV_CAT[x.categoria]||x.categoria)+(x.competencia? " · "+esc(compLabel(x.competencia)) : "")+' · enviado em '+fmtData(x.criado_em)+'</div></div></div>'; }).join("") : '') +
    '</div>';
}
function ligarEnvio(e){
  var inp = document.getElementById("envInp"); if(!inp) return;
  var drop = document.getElementById("envDrop"), form = document.getElementById("envForm");
  function lista(){
    form.style.display = envFila.length? "" : "none";
    document.getElementById("envLista").innerHTML = envFila.map(function(f, i){
      return '<div class="env-arq"><span style="word-break:break-all;">📄 '+esc(f.name)+' <span style="color:var(--ink-soft);">('+(f.size<1048576? Math.max(1,Math.round(f.size/1024))+' KB' : (f.size/1048576).toFixed(1).replace(".",",")+' MB')+')</span></span><button data-tira="'+i+'" aria-label="Tirar">✕</button></div>'; }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("[data-tira]"), function(b){ b.onclick = function(){ envFila.splice(Number(b.getAttribute("data-tira")),1); lista(); }; });
    var cat = document.getElementById("envCat");
    if(cat && !envCatSel && envFila.length && envFila.every(function(f){ return /\.(xml|zip)$/i.test(f.name); })) cat.value = "NOTA_FISCAL";
  }
  function somar(arqs){
    var recusados = [];
    Array.prototype.forEach.call(arqs, function(f){
      if(!envTipo(f.name)) recusados.push(f.name+" (tipo não aceito)");
      else if(f.size > ENV_MAX_MB*1024*1024) recusados.push(f.name+" (maior que "+ENV_MAX_MB+" MB)");
      else envFila.push(f);
    });
    if(recusados.length) toast("Não dá para enviar: "+recusados.join(", "));
    lista();
  }
  inp.onchange = function(){ somar(inp.files); inp.value = ""; };
  drop.addEventListener("dragover", function(ev){ ev.preventDefault(); drop.classList.add("on"); });
  drop.addEventListener("dragleave", function(){ drop.classList.remove("on"); });
  drop.addEventListener("drop", function(ev){ ev.preventDefault(); drop.classList.remove("on"); somar(ev.dataTransfer.files||[]); });
  lista();
  document.getElementById("envBtn").onclick = async function(){
    var b = this, escId = (dados.escritorio||{}).id, cat = document.getElementById("envCat").value, mes = document.getElementById("envMes").value, obs = document.getElementById("envObs").value;
    if(!envFila.length || !escId) return;
    b.disabled = true; var ok = 0, falhas = [];
    for(var i=0;i<envFila.length;i++){
      var f = envFila[i]; b.textContent = "Enviando "+(i+1)+" de "+envFila.length+"…";
      var path = escId+"/cliente/"+e.id+"/"+Date.now()+"_"+Math.random().toString(36).slice(2,8)+"_"+envNomeSeguro(f.name);
      var up = await sb.storage.from("documentos").upload(path, f, {upsert:false, contentType:envTipo(f.name)});
      if(up.error){ falhas.push(f.name); continue; }
      var docCod = cat.indexOf("DOC:")===0? cat.slice(4) : "";
      var r = await sb.rpc("portal_registrar_envio", {p_empresa:e.id, p_path:path, p_nome:f.name, p_tamanho:f.size, p_categoria: docCod? "DOCUMENTO" : cat, p_competencia: mes? mes+"-01" : null, p_obs:obs});
      if(r.error){ falhas.push(f.name+": "+traduz(r.error)); continue; }
      /* documento do mês (folha, despesas, outros): avisa qual é, para sair da cobrança */
      if(docCod && r.data){ try{ await sb.rpc("portal_vincular_doc", {p_envio:r.data, p_codigo:docCod, p_competencia: mes? mes+"-01" : null}); }catch(_){} }
      ok++;
    }
    envFila = []; envCatSel = "";
    if(ok) toast(ok===1? "Arquivo enviado ao escritório! ✓" : ok+" arquivos enviados ao escritório! ✓");
    if(falhas.length) setTimeout(function(){ toast("Não foi possível enviar: "+falhas.join("; ")); }, ok? 3300 : 0);
    carregar();
  };
}
function addDiasISO(iso, n){ var d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

sb.auth.onAuthStateChange(function(ev){ if(ev==="SIGNED_OUT"){ dados = null; } });
marcaInicial().then(iniciar, iniciar);
})();
</script>
